services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: clinsense-mosquitto
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./certs:/mosquitto/certs
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t healthcheck -m ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  localstack:
    image: localstack/localstack:3.8
    container_name: clinsense-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb,lambda,firehose,iam,sns,sqs,logs
      - DEBUG=0
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    container_name: clinsense-dashboard
    ports:
      - "8501:8501"
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      - localstack